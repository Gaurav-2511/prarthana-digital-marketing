<section class="admin-login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <i class="bi bi-graph-up-arrow"></i>
      </div>

      <h1>Prarthana<span> Digital</span></h1>
      <p>Grow Online • Grow Faster</p>
    </div>

    <div class="login-heading">
      <h2>Welcome Back!</h2>
      <p>Sign in to access your admin dashboard.</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Username</label>

        <div class="input-wrapper">
          <i class="bi bi-person"></i>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <div class="login-error" *ngIf="errorMessage()">
        <i class="bi bi-exclamation-circle"></i>
        {{ errorMessage() }}
      </div>

      <button type="submit" class="login-btn" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()"> Sign In <i class="bi bi-arrow-right"></i> </span>

        <span *ngIf="isSubmitting()">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Signing In...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <i class="bi bi-shield-lock"></i>
      Secure Admin Access
    </div>
  </div>
</section>
