
<header class="site-header">
  <nav class="navbar navbar-expand-lg">
    <div class="container">

      <!-- Brand -->
      <a class="navbar-brand brand" routerLink="/" (click)="closeMenu()">
        <span class="brand-icon">P</span>

        <span class="brand-text">
          <span class="brand-name">Prarthana</span>
          <span class="brand-subtitle">DIGITAL MARKETING</span>
        </span>
      </a>

      <!-- Mobile Menu Button -->
      <button
        class="navbar-toggler menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-controls="mainNavigation"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <i [class]="isMenuOpen() ? 'bi bi-x-lg' : 'bi bi-list'"></i>
      </button>

      <!-- Navigation -->
      <div
        class="navbar-collapse"
        id="mainNavigation"
        [class.show]="isMenuOpen()"
      >
        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/about"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              About
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/services"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              Services
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/portfolio"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              Portfolio
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/contact"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              Contact
            </a>
          </li>

          <li class="nav-item nav-cta">
            <a
              class="btn btn-primary-custom"
              routerLink="/contact"
              (click)="closeMenu()"
            >
              Get In Touch
              <i class="bi bi-arrow-up-right"></i>
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
</header>
